name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: claudetray-linux-x86_64
            binary: claudetray
          - os: ubuntu-24.04-arm
            asset: claudetray-linux-aarch64
            binary: claudetray
          - os: windows-latest
            asset: claudetray-windows-x86_64.exe
            binary: claudetray.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - shell: bash
        run: mkdir -p ../out && cp target/release/${{ matrix.binary }} ../out/${{ matrix.asset }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$($env:GITHUB_REF_NAME.TrimStart('v'))" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\ClaudeTray-windows-setup.exe ..\out\
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: mac/build.sh
      - run: |
          mkdir -p dmg out
          cp -R mac/build/ClaudeTray.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname ClaudeTray -srcfolder dmg -format UDZO -ov out/ClaudeTray-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeTray-macos.dmg
          path: out/ClaudeTray-macos.dmg

  release:
    needs: [desktop, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
