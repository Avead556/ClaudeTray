[package]
name = "claudetray"
version = "1.0.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
anyhow = "1"
auto-launch = "0.5"
chrono = { version = "0.4", features = ["unstable-locales"] }
dirs = "6"
global-hotkey = "0.7"
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "system-tray", "unstable-winit-030"] }
sys-locale = "0.3"
tiny-skia = "0.11"
ureq = { version = "2", features = ["json"] }

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[profile.release]
lto = true
strip = true
opt-level = "s"
